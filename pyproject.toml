[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-threat-model"
version = "0.2.0"
description = "Threat modeling for AI agent apps: describe your agent architecture in a spec, get a STRIDE-style threat model and a zero-trust scorecard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anusha Mukka" }]
keywords = ["ai-agents", "threat-model", "stride", "security", "zero-trust", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.4"]

[project.scripts]
agent-threat-model = "agent_threat_model.cli:main"

[project.urls]
Homepage = "https://github.com/anushamukka9/agent-threat-model"
Issues = "https://github.com/anushamukka9/agent-threat-model/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_threat_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
